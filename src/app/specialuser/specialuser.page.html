<ion-header [translucent]="true">
  <ion-toolbar color="primary">
  
  <ion-title>
  Special User
  </ion-title>
  <ion-button slot="start">
  <ion-menu-button></ion-menu-button>
  </ion-button>
  <!-- <ion-button (click)="SubCategory()">Next</ion-button> -->
  </ion-toolbar>
  </ion-header>
  
  <ion-content [fullscreen]="true" class="ion-padding">
  
  <form [formGroup]="specialuserForm" >
  
  <ion-item>
  <ion-label position="floating">Email Id / Mobile No</ion-label>
  <ion-input formControlName="user_id"></ion-input>
  </ion-item>
  
  <!-- <input type="hidden" name="max_id" value="max_id" [(ngModel)]="max_id" formControlName="cat_id"> -->
  <!-- {{ specialuserList | json }} -->
  <ion-item>
  <ion-button (click)="CreateRecord()" [disabled]="specialuserForm.invalid">
  <ion-icon size="small" slot="icon-only" name="add"></ion-icon>
  &nbsp;Create Record
  </ion-button>
  </ion-item>
  </form>

  <!----------------------------------------------------------------------------------------->
  
  <ion-card color="medium">
  <ion-card *ngFor="let item of productnamearr" color="primary">
  <span *ngIf="!item.isEdit; else elseBlock">
  <ion-card-header>
  <!-- <ion-card-title>{{item.Category}} of {{item.Age}} years</ion-card-title> -->
  <ion-card-subtitle>Id: {{item.user_id}}</ion-card-subtitle>
  <ion-card-subtitle>Product Name: {{item.Product_name}}</ion-card-subtitle>
  <ion-card-subtitle>Include GST: {{item.include_gst}}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
  
  <ion-button shape="round" color="secondary" size="small" (click)="EditRecord(item)">
    <ion-icon size="small" slot="icon-only" name="create"></ion-icon>
  </ion-button>

  <ion-button shape="round" color="danger" size="small" (click)="RemoveRecord(item.id)">
    <ion-icon size="small" slot="icon-only" name="trash"></ion-icon>
  </ion-button>

  <ion-button shape="round" color="danger" size="small" class="list" (click)="openModel(item)">
    <ion-icon size="small" slot="icon-only" name="cart"></ion-icon>
  </ion-button>

  <ion-button shape="round" color="success" size="small" (click)="opencartModel(item)">
    <ion-icon size="small" slot="icon-only" name="newspaper"></ion-icon>
  </ion-button>

  </ion-card-content>
  </span>
  <ng-template #elseBlock>
  <ion-card-header>
  <ion-card-title>
  <ion-grid>
  <ion-row>
  <ion-col>
  Edit
  </ion-col>
  <ion-col>
  <ion-button fill="solid" color="medium" size="small" (click)="item.isEdit = false">
  Cancel
  </ion-button>
  </ion-col>
  <ion-col>
  <ion-button fill="solid" color="success" size="small" (click)="UpdateRecord(item)">
  Update
  </ion-button>
  </ion-col>
  </ion-row>
  </ion-grid>
  </ion-card-title>
  </ion-card-header>
  <ion-card-content>
  <ion-item>
  <ion-label><strong>User Id</strong></ion-label>
  <ion-input type="text" [(ngModel)]="item.EditUserid"></ion-input>
  </ion-item>
  <ion-item>
    <ion-label><strong>Include GST</strong></ion-label>
    <ion-checkbox [(ngModel)]="item.Editinclude_gst"></ion-checkbox>
  </ion-item>
  </ion-card-content>
  </ng-template>
  </ion-card>
  </ion-card>
  </ion-content>
