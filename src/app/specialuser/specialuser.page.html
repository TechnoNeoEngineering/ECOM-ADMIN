<ion-header [translucent]="true">
  <ion-toolbar class="color">
    <ion-title style="color: white;">
      Special User
    </ion-title>
    <ion-button slot="start" class="color">
      <ion-menu-button></ion-menu-button>
    </ion-button>
  </ion-toolbar>
  </ion-header>
  
  <ion-content [fullscreen]="true" class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12">
      <form [formGroup]="specialuserForm" >
        <ion-row>
          <ion-col size="6">
            <ion-item>
              <ion-label position="floating">Email Id / Mobile No</ion-label>
              <ion-input formControlName="user_id"></ion-input>
              </ion-item>
          </ion-col>
          <ion-col size="6">
             <ion-button (click)="CreateRecord()" [disabled]="specialuserForm.invalid">
              <ion-icon size="small" slot="icon-only" name="add"></ion-icon>
              &nbsp;Create Record
              </ion-button>
             
          </ion-col>
        </ion-row>
    </form>
  </ion-col>
  </ion-row>
  </ion-grid>

  <ion-card color="medium">
  <ion-card *ngFor="let item of productnamearr">
  <span *ngIf="!item.isEdit; else elseBlock">
  
  <!-- <ion-card-title>{{item.Category}} of {{item.Age}} years</ion-card-title>u -->
  
  <ion-row>
    <ion-col size="6">
      <ion-card-title style="font-size: 16px;">
        ID : <b>{{item.user_id}}</b> 
      </ion-card-title>    
    </ion-col>
    <ion-col size="6">
  <div class="text-end vertical-middle">
    <ion-button shape="round" color="light" size="small" (click)="EditRecord(item)">
      <ion-icon size="small" color="secondary" slot="icon-only" name="create"></ion-icon>
    </ion-button>
  
    <ion-button shape="round" color="light" size="small" (click)="RemoveRecord(item.id)">
      <ion-icon size="small" slot="icon-only" color="danger" name="trash"></ion-icon>
    </ion-button>
  
    <ion-button shape="round" color="light" size="small" class="list" (click)="openModel(item)">
      <ion-icon size="small" slot="icon-only" color="medium" name="cart"></ion-icon>
    </ion-button>
  
    <ion-button shape="round" color="light" size="small" (click)="opencartModel(item)">
      <ion-icon size="small" slot="icon-only" color="success" name="newspaper"></ion-icon>
    </ion-button>
  </div>    
    </ion-col>
  </ion-row>
  <ion-card-content>
<div class="">
  Product Name: {{item.Product_name}}
</div>
<div class="">
  Include GST: {{item.include_gst}}
</div>
  </ion-card-content>
  </span>
  <ng-template #elseBlock>
  <ion-card-header>
  <ion-card-title>
  <ion-row>
  <ion-col style="background: #F4ECF7;">
  Edit Your Details
  </ion-col>
  </ion-row>
  </ion-card-title>
  </ion-card-header>
  <ion-card-content>
<ion-row>
  <ion-col size="6">
    <ion-item>
      <ion-label><strong>User Id</strong></ion-label>
      <ion-input type="text" [(ngModel)]="item.EditUserid"></ion-input>
      </ion-item>
  </ion-col>
  <ion-col size="6">
    <ion-item style="width: 40%;">
      <ion-label><strong>Include GST</strong></ion-label>
      <ion-checkbox [(ngModel)]="item.Editinclude_gst" ></ion-checkbox>
    </ion-item>  
  </ion-col>
  <ion-col>
    <div class="ion-text-right">

      <ion-button fill="solid" color="medium" size="small" (click)="item.isEdit = false">
        Cancel
        </ion-button>
        <ion-button fill="solid" color="success" size="small" (click)="UpdateRecord(item)">
          Update
          </ion-button>
    </div>
    </ion-col>
</ion-row>
  
  </ion-card-content>
  </ng-template>
  </ion-card>
  </ion-card>
  </ion-content>
