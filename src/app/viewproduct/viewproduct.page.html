<ion-header>
	<ion-toolbar color="primary">
		<ion-title>
			View Product Details
		</ion-title>
      <ion-button slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-button>
		<ion-button (click)="switchStyle()" slot="end" color="light">
			{{ tableStyle }}
    	</ion-button> 
	</ion-toolbar>
</ion-header>

<ion-content>
  <ngx-datatable
	[rows]="adminarr"
	[ngClass]="tableStyle"
	[rowHeight]="'auto'"
	[headerHeight]="50"
	[columnMode]="'force'"
	[limit]="10" 
	[rows]="rows" 
	[rowHeight]="50" 
	[sortType]="'multi'" 
	[sorts]="[{prop: 'Product_id', dir: 'asc'}]"
	[footerHeight]="50"
	[rowClass]="getRowClass.bind(this)">
	
	<ngx-datatable-column name="Product Id" prop="Product_id"></ngx-datatable-column>
	<ngx-datatable-column name="Product Name" prop="Product_name"></ngx-datatable-column>
	<ngx-datatable-column name="Price" prop="Price1"></ngx-datatable-column>
    <ngx-datatable-column name="Subcategory Id" prop="SubCategory_id"></ngx-datatable-column>
	<!-- <ngx-datatable-column name="Brand" prop="Brand"></ngx-datatable-column>
	<ngx-datatable-column name="Model" prop="Model"></ngx-datatable-column>
	<ngx-datatable-column name="Manufacture Date" prop="YearOfManufacture"></ngx-datatable-column>
	<ngx-datatable-column name="Expiry" prop="Expiry"></ngx-datatable-column> -->
	
	

	
	<ngx-datatable-column name="Edit" [sortable]="false">
		<ng-template let-row="row" ngx-datatable-cell-template>
			<ion-button size="small" fill="outline" (click)="imgClick(row)"  
				slot="end">Edit</ion-button>
		</ng-template>
	</ngx-datatable-column>
    
    <ngx-datatable-column name="Delete" [sortable]="false">
			<ng-template let-row="row" ngx-datatable-cell-template>
				<ion-button size="small" fill="outline" (click)="deleterow(row)"  
					slot="end">Delete</ion-button>
			</ng-template>
		</ngx-datatable-column>
  
  </ngx-datatable>

  <!-- <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator> -->

</ion-content>
