<ion-header [translucent]="true">
  <ion-toolbar class="color">
    <ion-title style="color: white;">
      Add SubCategory
    </ion-title>
    <ion-button slot="start" class="color">
      <ion-menu-button></ion-menu-button>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" >
  <form [formGroup]="SubCategoryform">
    <ion-item>
      <ion-label>Category</ion-label>
      <ion-select interface="popover" (ionChange)="setCategoryValues(sCat)" [(ngModel)]="sCat" formControlName="cat_id">
           <ion-select-option [value]="sCat.cat_id" *ngFor ="let sCat of categoryList">{{sCat.Category}} </ion-select-option> 
     </ion-select>  
  </ion-item>
  <!-- {{categoryList|json}} -->
  <ion-item>
    <ion-label position="floating">Sub Category</ion-label>
    <ion-input formControlName="SubCategory"></ion-input>
  </ion-item>
  <!-- {{filtered|json}} -->
<input type="hidden" name="max_id" value="max_id" [(ngModel)]="max_id" formControlName="SubCategory_id">
<ion-item>
  <ion-button (click)="CreateSubCategory()" [disabled]="SubCategoryform.invalid">
    <ion-icon size="small" slot="icon-only" name="add"></ion-icon>
    &nbsp;Create Record
  </ion-button>
</ion-item>
</form>

<ion-card color="medium">
  <ion-card *ngFor="let item of filtered"  color="primary">
    <span *ngIf="!item.isEdit; else elseBlock">
      <ion-card-header>
        <ion-card-subtitle>Category Name: {{item.Category}}</ion-card-subtitle>
        <ion-card-subtitle>Subcategory Id: {{item.SubCategory_id}} & Name: {{item.SubCategory}}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-button shape="round" color="secondary" size="small" (click)="EditRecord(item)">
          <ion-icon size="small" slot="icon-only" name="create"></ion-icon>
        </ion-button>
        <ion-button shape="round" color="danger" size="small" (click)="RemoveRecord(item.id)">
          <ion-icon size="small" slot="icon-only" name="trash"></ion-icon>
        </ion-button>
      </ion-card-content>
    </span>
    <ng-template #elseBlock>
      <ion-card-header>
        <ion-card-title>
          <ion-grid>
            <ion-row>
              <ion-col>
                Edit
              </ion-col>
              <ion-col>
                <ion-button fill="solid" color="medium" size="small" (click)="item.isEdit = false">
                  Cancel
                </ion-button>
              </ion-col>
              <ion-col>
                <ion-button fill="solid" color="success" size="small" (click)="UpdateRecord(item)">
                  Update
                </ion-button>
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-label><strong>SubCategory</strong></ion-label>
          <ion-input type="text" [(ngModel)]="item.EditSubCategory"></ion-input>
        </ion-item>
      </ion-card-content>
    </ng-template>
  </ion-card>
</ion-card>
</ion-content>
