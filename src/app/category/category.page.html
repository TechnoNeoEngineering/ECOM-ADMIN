<ion-header [translucent]="true">
  <ion-toolbar class="color">
    <ion-title style="color: white;">
      Category
    </ion-title>
    <ion-button slot="start" class="color">
      <ion-menu-button></ion-menu-button>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <form [formGroup]="categoryForm">
          <ion-row>
            <ion-col size="5">
              <ion-item>
                <ion-label position="floating">Category</ion-label>
                <ion-input formControlName="Category"></ion-input>
              </ion-item>
            </ion-col>
            <ion-col size="5">
              <ion-item>
                <ion-label position="floating">Category Image</ion-label>
                <ion-input formControlName="cat_image"></ion-input>
              </ion-item>
            </ion-col>
            <ion-col size="2">
              <div class="text-right">
                <ion-button class="ion-text-right" color="tertiary" (click)="CreateRecord()"
                  [disabled]="categoryForm.invalid">
                  <ion-icon color="light" size="small" slot="icon-only" name="add"></ion-icon>
                  &nbsp;Create Record
                </ion-button>
              </div>
              <input type="hidden" name="max_id" value="max_id" [(ngModel)]="max_id" formControlName="cat_id">

            </ion-col>
          </ion-row>

        </form>
      </ion-col>
    </ion-row>
  </ion-grid>

            <ion-button fill="solid" color="medium" size="small" (click)="item.isEdit = false">
              Add Category

  <!----------------------------------------------------------------------------------------->
  <ion-grid>
    <ion-row style="background: #F4ECF7;">
      <ion-col size="1" offset="1">
        <div class="py-1">
          ID
        </div>
      </ion-col>
      <ion-col size="4">
        <div class="py-1">

        </div>
        CATEGORY
      </ion-col>
      <ion-col size="3">
        <div class="py-1">

          URL
        </div>
      </ion-col>
      <ion-col size="3">
      </ion-col>
    </ion-row>
    <div *ngFor="let item of categoryList" class="py-1">
      <ion-row *ngIf="!item.isEdit; else elseBlock" class="border">
        <ion-col size="1" offset="1">
          <h4 style="vertical-align: middle;" class="py-1">
            {{item.cat_id}}
          </h4>
        </ion-col>

        <ion-col size="4">
          <h4 style="vertical-align: middle;" class="py-1">
            {{item.Category}}
          </h4>
        </ion-col>

        <ion-col size="3">
          <h4 style="vertical-align: middle;" class="py-1">
            {{item.cat_image}}
          </h4>
        </ion-col>
        <ion-col size="3">
          <ion-button shape="round" color="secondary" size="small" (click)="EditRecord(item)">
            <ion-icon size="small" slot="icon-only" name="create"></ion-icon>
          </ion-button>
          <ion-button shape="round" color="danger" size="small" (click)="RemoveRecord(item.id)">
            <ion-icon size="small" slot="icon-only" name="trash"></ion-icon>

          </ion-button>
        </ion-col>
      </ion-row>
      <ng-template #elseBlock>
        <ion-row>
          <ion-col size="4" offset="2">
            <ion-item lines="none" style="--background: #F4ECF7;">
              <ion-label position="stacked"><strong>Category</strong></ion-label>
              <ion-input type="text" [(ngModel)]="item.EditCategory"></ion-input>
            </ion-item>
          </ion-col>
          <ion-col size="4">
            <ion-item lines="none" style="--background: #F4ECF7;">
              <ion-label position="stacked"><strong>Category Image</strong></ion-label>
              <ion-input type="text" [(ngModel)]="item.Editcat_image"></ion-input>
            </ion-item>
          </ion-col>

          <ion-col size="12">
            <div class="ion-text-end">
              <ion-button fill="solid" color="tertiary" size="small" (click)="item.isEdit = false">
                Cancel
              </ion-button>
              <ion-button fill="solid" color="tertiary" size="small" (click)="UpdateRecord(item)">
                Update
              </ion-button>
            </div>
          </ion-col>
        </ion-row>


      </ng-template>
    </div>

  </ion-grid>
</ion-content>
