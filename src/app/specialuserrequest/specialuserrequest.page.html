<ion-header>
  <ion-toolbar class="color">
    <ion-title style="color: white;">Special User Request</ion-title>
    <ion-button slot="start" class="color">
      <ion-menu-button></ion-menu-button>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <h2>Specail User Request Details</h2>
      </ion-col>
    </ion-row>
     <!-- {{ RequestForm1 | json}} -->
    <ion-row>
      <table class="table table-bordered">
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Mobile</th>
            <th scope="col">Email</th>
            <th scope="col">Address</th>
            <th scope="col">Product</th>
            <th scope="col">Date</th>
            <th scope="col">Accept/Decline</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor ="let special of RequestForm1">
            <td>{{ special.Name }}</td>
            <td>{{ special.Mobile }}</td>
            <td>{{ special.Email }}</td>
            <td>{{ special.Address }}</td>
            <td>{{ special.Products}}</td>
            <td>{{ special.Date }}</td>
            <td>
              <ion-button (click)="accept(special)" color="tertiary" size="small"> Accept</ion-button>
              <ion-button (click)="decline(special.id)" color="light" size="small">Decline</ion-button>
            </td>
          </tr>
        </tbody>
      </table>
    </ion-row>
  </ion-grid>
</ion-content>
