<ion-header [translucent]="true">
  <ion-toolbar class="color">
    <ion-title style="color: white;">
      Banner
    </ion-title>
    <ion-button slot="start" class="color">
      <ion-menu-button></ion-menu-button>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <form [formGroup]="bannerForm">
<ion-row>
  <ion-col size="6" >
    <ion-item>
      <ion-label position="floating">Banner</ion-label>
      <ion-input formControlName="Banner"></ion-input>
    </ion-item>
    </ion-col >
    <ion-col size="6" >
      <ion-item>
        <ion-label position="floating">Banner Image</ion-label>
        <ion-input formControlName="ban_image"></ion-input>
      </ion-item>
      <input type="hidden" name="max_id" value="max_id" [(ngModel)]="max_id" formControlName="ban_id">
    </ion-col>
    <ion-col size="12">
      <ion-item >
        <ion-button slot="end" color="tertiary" (click)="CreateRecord()" [disabled]="bannerForm.invalid">
          <ion-icon size="small" slot="icon-only" name="add"></ion-icon>
          &nbsp;Create Record
        </ion-button>
      </ion-item>
    </ion-col>
</ion-row>
    



  </form>

  <!-- <ion-grid>
    <ion-row>
           <ion-col>
            <ion-button fill="solid" color="medium" size="small" (click)="item.isEdit = false">
              Add Category
            </ion-button>
      </ion-col>
      <ion-col >
        <ion-searchbar></ion-searchbar>

    </ion-row>
  </ion-grid> -->
  <!----------------------------------------------------------------------------------------->
  <ion-grid>
    <ion-row style="background: #F4ECF7;">
      <ion-col size="1" offset="1">
        <div class="py-1">
          ID
        </div>
      </ion-col>
      <ion-col size="4">
        <div class="py-1">
          CATEGORY
        </div>
      </ion-col>
      <ion-col size="3">
        <div class="py-1">

          URL
        </div>
      </ion-col>
      <ion-col size="3">
      </ion-col>
    </ion-row>
    </ion-grid>
    <div class="py-1" *ngFor="let item of bannerList" >
      <ion-row  class="border" *ngIf="!item.isEdit; else elseBlock">
        <ion-col size="1" offset="1">
          <h4 style="vertical-align: middle;" class="py-1">
            {{item.ban_id}}
          </h4>
        </ion-col>

        <ion-col size="4">
          <h4 style="vertical-align: middle;" class="py-1">
            {{item.Banner}}
          </h4>
        </ion-col>

        <ion-col size="3">
          <h4 style="vertical-align: middle;" class="py-1">
            {{item.ban_image}}
          </h4>
        </ion-col>
        <ion-col size="3">
          <ion-button shape="round" color="tertiary" size="small" (click)="EditRecord(item)">
            <ion-icon size="small" slot="icon-only" name="create"></ion-icon>EDIT 
          </ion-button>
          <ion-button shape="round" color="medium" size="small"(click)="RemoveRecord(item.id)" >
            <ion-icon size="small" slot="icon-only" name="trash"></ion-icon>DELETE

          </ion-button>
        </ion-col>
      </ion-row>
      <ng-template #elseBlock>
        <ion-row>
          <ion-col size="4" offset="2">
            <ion-item lines="none" style="--background: #F4ECF7;">
              <ion-label position="stacked"><strong>Category</strong></ion-label>
              <ion-input type="text" [(ngModel)]="item.EditBanner" ></ion-input>
            </ion-item>
          </ion-col>
          <ion-col size="4">
            <ion-item lines="none" style="--background: #F4ECF7;">
              <ion-label position="stacked"><strong>Category Image</strong></ion-label>
              <ion-input type="text" [(ngModel)]="item.Editban_image" ></ion-input>
            </ion-item>
          </ion-col>

          <ion-col size="12">
            <div class="ion-text-end">
              <ion-button fill="solid" color="medium" size="small"(click)="item.isEdit = false" >
                Cancel
              </ion-button>
              <ion-button fill="solid" color="tertiary" size="small"  (click)="UpdateRecord(item)">
                Update
              </ion-button>
            </div>
          </ion-col>
        </ion-row>


      </ng-template>
    </div>

  
</ion-content>
