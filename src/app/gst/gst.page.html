<ion-header>
  <ion-toolbar class="color">
    <ion-title style="color: white;">GST</ion-title>
    <ion-button slot="start" class="color">
      <ion-menu-button></ion-menu-button>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <form [formGroup]="gstForm" >
<ion-row>
  <ion-col size="6">
    <ion-item>
      <ion-label position="floating">Tax Rates</ion-label>
      <ion-input formControlName="taxrates"></ion-input>
    </ion-item>
  </ion-col >
  <ion-col size="6">
  <ion-item>
    <ion-label position="floating">Products</ion-label>
    <ion-input formControlName="products"></ion-input>
  </ion-item>
  </ion-col>
  <ion-col size="12">
    <input type="hidden" value="max_id" [(ngModel)]="max_id" formControlName="gst_id">
    <ion-item lines="none">
      <ion-button color="tertiary" slot="end" (click)="CreateRecord()" [disabled]="gstForm.invalid">
        <ion-icon size="small" slot="icon-only" name="add"></ion-icon>
        &nbsp;Create Record
      </ion-button>
    </ion-item>
  </ion-col>
</ion-row>
    
    

  </form> 
 
<!----------------------------------------------------------------------------------------->
<ion-grid>
  <ion-row style="background: #F4ECF7;">
    <ion-col size="1" offset="1">
      <div class="py-1">
       GST ID
      </div>
    </ion-col>
    <ion-col size="2">
      <div class="py-1">
TAX RATES
      </div>
      
    </ion-col>
    <ion-col size="3">
      <div class="py-1">

      PRODUCTS
      </div>
    </ion-col>
    <ion-col size="3">
    </ion-col>
  </ion-row>
  <div *ngFor="let item of gstlist"class="py-1">
    <ion-row *ngIf="!item.isEdit; else elseBlock"class="border">
      <ion-col size="1" offset="1">
        <h4 style="vertical-align: middle;" class="py-1">
          {{item.gst_id}}        </h4>
      </ion-col>

      <ion-col size="2">
        <h4 style="vertical-align: middle;" class="py-1">
          {{item.taxrates}}
        </h4>
      </ion-col>

      <ion-col size="3">
        <h4 style="vertical-align: middle;" class="py-1">
          {{item.products}}        </h4>
      </ion-col>
      <ion-col size="3">
        <ion-item>
          <ion-button shape="round" slot="end" color="tertiary" size="small" (click)="EditRecord(item)">
            <ion-icon size="small" slot="icon-only" name="create"></ion-icon>EDIT
          </ion-button>
          <ion-button shape="round" slot="end" color="medium" size="small" (click)="RemoveRecord(item.id)">
            <ion-icon size="small" slot="icon-only" name="trash"></ion-icon>DELETE
  
          </ion-button>
        </ion-item>
       
      </ion-col>
    </ion-row>
    <ng-template #elseBlock>
      <ion-row>
        <ion-col size="4" offset="2">
          <ion-item style="--background: #F4ECF7;">
            <ion-label position="floating"><strong>Tax Rates:</strong></ion-label>
            <ion-input type="text" [(ngModel)]="item.Edittaxrates"></ion-input>
          </ion-item>
        </ion-col>
        <ion-col size="4">
          <ion-item lines="none" style="--background: #F4ECF7;">
            <ion-label position="floating"><strong>Products:</strong></ion-label>
            <ion-input type="text" [(ngModel)]="item.Editproducts"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="12">
          <div class="ion-text-end">
            <ion-button fill="solid" color="medium" size="small"  (click)="item.isEdit = false">
              Cancel
            </ion-button>
            <ion-button fill="solid" color="tertiary" size="small" (click)="UpdateRecord(item)">
              Update
            </ion-button>
          </div>
        </ion-col>
      </ion-row>


    </ng-template>
  </div>
</ion-grid>

</ion-content>
