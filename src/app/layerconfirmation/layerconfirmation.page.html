<ion-header>
  <ion-toolbar class="ion-text-center">
    <ion-title>layerconfirmation</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- <div [ngSwitch]='layer'> 
  <div *ngSwitchCase="'layer1'"> -->
    <div class="container">
      <ion-list>
        <ion-item lines='none'>
          <input class="form-control" type='text' [(ngModel)]='name' placeholder='Name'>
        </ion-item><br>
        <ion-item lines='none'>
          <input class="form-control" type='tel' maxlength=10 [(ngModel)]='phoneno' placeholder='PhoneNo'>
        </ion-item><br>
        <ion-item lines='none'>
          <input class="form-control" type='text' [(ngModel)]='email' placeholder='Email'>
        </ion-item><br>
        <ion-item lines='none'>
          <input class="form-control" type='tel' maxlength=4 [(ngModel)]='passcode' placeholder='passcode'>
        </ion-item><br>
        <ion-item lines='none'>
          <ion-label>Select Layer</ion-label>
          <ion-select [(ngModel)]='layers' >
            <ion-select-option>
              <h3>Layer1</h3>
            </ion-select-option>
            <ion-select-option>
              <h3>Layer2</h3>
            </ion-select-option>
          </ion-select>
          <!-- <input type='text' [(ngModel)]='layer1' placeholder='Layer1'> -->
        </ion-item><br>
      </ion-list><br>
      <div class="ion-text-center">
        <ion-button  (click)='submit()'>Submit</ion-button>
      </div>
    </div>
  <!-- </div>
  </div> -->
 <div class="container">
   <ion-list *ngFor='let item of layerconfirm'>
     <ion-grid>
       <ion-row>
         <ion-col size-md='6'>
           <h3>Name: &nbsp;{{item.name}}</h3>
           <h3>Email: &nbsp;{{item.email}}</h3>
           <h3>PhoneNo: &nbsp;{{item.phoneno}}</h3>
         </ion-col>
         <ion-col size-md='4'>
          <h3 style="color: crimson;"> &nbsp;{{item.layer}}</h3><br>
        </ion-col>
        <ion-col size-md='2'>
          <ion-button (click)='delete(item)' fill='clear' color='danger'>
            <ion-icon name='trash'></ion-icon>
          </ion-button>
        </ion-col>
       </ion-row><hr>
     </ion-grid>
   </ion-list>
 </div>
</ion-content>
