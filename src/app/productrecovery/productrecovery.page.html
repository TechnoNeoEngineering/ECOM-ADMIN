<ion-header>
	<ion-toolbar color="primary">
		<ion-title>
			Product Recovery
    	</ion-title>
      <ion-button slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-button>
		<ion-button (click)="switchStyle()" slot="end" color="light">
			{{ tableStyle }}
		</ion-button>    
	</ion-toolbar>
</ion-header>

<ion-content>
  <ngx-datatable
    [rows]="adminarr"
    [ngClass]="tableStyle"
	[rowHeight]="'auto'"
	[headerHeight]="50"
	[columnMode]="'force'"
	[limit]="10" 
	[rows]="rows" 
	[rowHeight]="50" 
	[columnMode]="'force'" 
	[sortType]="'multi'" 
	[sorts]="[{prop: 'Product_id', dir: 'asc'}]"
	[headerHeight]="50" 
	[footerHeight]="50"
	[rowClass]="getRowClass.bind(this)" >
	
		<!-- <ngx-datatable-column name="S.NO" prop="rowcount"></ngx-datatable-column> -->
		<ngx-datatable-column name="Product Id" prop="Product_id"></ngx-datatable-column>
		<ngx-datatable-column name="Product Name" prop="Product_name"></ngx-datatable-column>
		<ngx-datatable-column name="Price" prop="Price1"></ngx-datatable-column>
		<ngx-datatable-column name="Subcategory Id" prop="SubCategory_id"></ngx-datatable-column>		
 		<ngx-datatable-column name="Deleted" prop="Deleted"></ngx-datatable-column>

	
	<ngx-datatable-column name="Recovery" [sortable]="false">
		<ng-template let-row="row" ngx-datatable-cell-template>
			<ion-button size="small" fill="outline" (click)="deleterow(row)"  
				slot="end">Recovery</ion-button>
		</ng-template>
	</ngx-datatable-column>
  
  </ngx-datatable>

  </ion-content>
