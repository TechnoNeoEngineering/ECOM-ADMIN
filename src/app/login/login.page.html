<ion-content class="bg">    
  <div class="row">                 
       <div class="container-login col-md-4"> 
        <ion-card-header class="text-center">
          <img src="/assets/icon/favicon.png" style="width:5em;height: auto;" class="img-responsive" alt="">
        </ion-card-header >          
           <ion-grid size-md="6" offset-md="3">               
               <ion-row>                
                   <ion-col><br>                    
              <form class="form" [formGroup]="moblogin" (ngSubmit)="form_moblogin(phoneNumber)">                                                                          
                           <ion-item>                               
                                 <ion-icon name="phone-portrait-outline" slot="start"></ion-icon>
                                 <ion-icon name="alert-circle-outline" slot="end"
                                 *ngIf="moblogin.controls.phoneNumber.invalid && moblogin.controls.phoneNumber.dirty" class="alert-msg"></ion-icon>
                               <ion-input maxlength="10" type="tel" formControlName="phoneNumber" [(ngModel)]="phoneNumber" placeholder="Mobile No" ></ion-input>
                           </ion-item>
                          <br>  
                           <div class="text-center">                          
                             <ion-button  [disabled]='!phoneNumber' style="--background: #895194;" fill="solid" type= "submit">Login</ion-button><br>
                           </div>                      
                       <div id="recaptcha-container"></div>
                       </form>
                   </ion-col>
               </ion-row>         
           </ion-grid>
       </div>
   </div>
</ion-content>
