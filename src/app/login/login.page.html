<ion-header>

</ion-header>

<ion-content fullscreen>
  <form class="form m-auto " [formGroup]="validations_form" (ngSubmit)="loginUser(validations_form.value)">
    <div class="container" style="margin-top: 5%;">
    <div class="row ">
    <div class="col-md-6 m-auto">
      <div class="col-padding border p-3">
        <p class="para text-center ">Get started with our secure login flow</p>
        <ion-item class="py-2" lines="none" class="border">
          <ion-label position="floating">Email Address</ion-label>
          <ion-input type="text" formControlName="email" ></ion-input>
        </ion-item>
        <div class="validation-errors">
          <ng-container *ngFor="let validation of validation_messages.email">
            <div class="error-message" style="color: red;"
              *ngIf="validations_form.get('email').hasError(validation.type) && (validations_form.get('email').dirty || validations_form.get('email').touched)">
              {{ validation.message }}
            </div>
          </ng-container>
        </div>
       <ion-item class="py-2" lines="none" class="border">
        <ion-label class="required" position="floating">Password</ion-label>
        <ion-input class="text" [type]="passwordType" clearOnEdit="false" formControlName="password"required></ion-input>
      </ion-item>      
        <div class="validation-errors">
          <ng-container *ngFor="let validation of validation_messages.password">
            <div class="error-message" style="color: red;"
              *ngIf="validations_form.get('password').hasError(validation.type) && (validations_form.get('password').dirty || validations_form.get('password').touched)">
              {{ validation.message }}
            </div>
          </ng-container>
        </div>
        <div class="check py-2">
          <ion-item style="width: 50%;" class="p-0" lines="none">
            <ion-checkbox class="m-1" slot="start" (click)="hideShowPassword()"></ion-checkbox>
            <ion-label >
              Show Password
            </ion-label>        
          </ion-item>
        </div>
        <div class="text-right" style="text-align: right;">
          <ion-button color="tertiary" type="submit" [disabled]="!validations_form.valid"><b>Continue</b></ion-button>
          <label  class="error-message">{{errorMessage}}</label>  
        </div>        
      </div>
    </div>
    </div>
    </div>
  
</form>


</ion-content>
